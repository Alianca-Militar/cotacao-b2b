<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastros | Aliança Militar</title>
  <link rel="icon" type="image/png" href="assets/icons/favicon.png">
  <!-- App no celular (PWA): ícone, nome e cor -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#202c52">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Propostas">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="app-header"></header>

  <main>
    <div class="titulo-pagina">
      <div>
        <h1>Cadastros</h1>
        <div class="sub">Listas usadas no cadastro de produtos e nas cotações</div>
      </div>
      <button class="btn btn-dourado" id="btn-novo">+ Novo</button>
    </div>

    <div class="abas" role="tablist">
      <button class="aba" data-aba="grupos" role="tab">Grupos</button>
      <button class="aba" data-aba="tipos_corporacao" role="tab">Tipos de corporação</button>
      <button class="aba" data-aba="corporacoes" role="tab">Corporações</button>
      <button class="aba" data-aba="condicoes_pagamento" role="tab">Condições de pagamento</button>
      <button class="aba" data-aba="prazos_entrega" role="tab">Prazos de entrega</button>
    </div>

    <div class="card card-aba">
      <div class="filtros">
        <div class="busca"><input type="search" id="busca" placeholder="Pesquisar por código ou descrição" autocomplete="off"></div>
        <span class="contador" id="contador" style="margin: 0"></span>
      </div>
      <div class="tabela-wrap">
        <table class="tabela">
          <thead>
            <tr>
              <th style="width: 80px" class="col-ordem num">Ordem</th>
              <th style="width: 160px">Código</th>
              <th>Descrição</th>
              <th class="num col-pct" style="width: 110px">% Desconto</th>
              <th class="num col-pct" style="width: 110px">% Acréscimo</th>
              <th class="num col-produtos" style="width: 120px">Produtos</th>
              <th style="width: 170px"></th>
            </tr>
          </thead>
          <tbody id="lista"><tr><td colspan="7" class="carregando">Carregando...</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>

  <dialog id="dlg">
    <form method="dialog" id="form">
      <h3 id="dlg-titulo"></h3>
      <div class="grid" style="grid-template-columns: 140px 1fr">
        <div><label for="f-cod">Código *</label><input id="f-cod" required maxlength="30"></div>
        <div><label for="f-descricao">Descrição *</label><input id="f-descricao" required></div>
        <div class="campo-ordem"><label for="f-ordem">Ordem na lista</label><input id="f-ordem" type="number" min="0" step="1"></div>
        <div class="campo-pct"></div>
        <div class="campo-pct"><label for="f-desconto_pct">% de desconto automático</label><input id="f-desconto_pct" inputmode="decimal" placeholder="0"></div>
        <div class="campo-pct"></div>
        <div class="campo-pct"><label for="f-acrescimo_pct">% de acréscimo automático</label><input id="f-acrescimo_pct" inputmode="decimal" placeholder="0"></div>
      </div>
      <p class="ajuda campo-pct" style="margin: 10px 0 0">Aplicado sobre o subtotal dos itens quando esta condição for escolhida na cotação.</p>
      <p class="ajuda" id="dlg-aviso" style="margin: 12px 0 0"></p>
      <div class="acoes">
        <button type="button" class="btn" data-fechar>Cancelar</button>
        <button type="submit" class="btn btn-primario">Salvar</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/env.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/cadastros.js"></script>
</body>
</html>
