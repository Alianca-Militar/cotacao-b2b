<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Aliança Militar</title>
  <link rel="icon" type="image/png" href="assets/icons/favicon.png">
  <!-- App no celular (PWA): ícone, nome e cor -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#202c52">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Propostas">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-login">
  <form class="caixa-login" id="form-login">
    <img src="assets/logos/logo-alianca.png" alt="Aliança Militar">
    <h1>Sistema de Propostas Comerciais</h1>
    <div class="grid">
      <div><label for="email">E-mail</label><input type="email" id="email" required autocomplete="username" autofocus></div>
      <div><label for="senha">Senha</label><input type="password" id="senha" required autocomplete="current-password"></div>
      <div class="erro" id="erro"></div>
      <button class="btn btn-primario" type="submit" id="btn-entrar">Entrar</button>
    </div>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/env.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script>
    (async () => {
      if (await DB.auth.usuario()) location.href = 'index.html';
    })();

    document.getElementById('form-login').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn-entrar');
      const erro = document.getElementById('erro');
      btn.disabled = true;
      erro.textContent = '';
      try {
        await DB.auth.entrar(document.getElementById('email').value.trim(), document.getElementById('senha').value);
        location.href = 'index.html';
      } catch (err) {
        erro.textContent = /invalid/i.test(err.message) ? 'E-mail ou senha incorretos.' : err.message;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
